name: your_todo
description: "ORDO — Daily task tracker for entrepreneurs."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  uuid: ^4.5.1
  intl: ^0.20.2
  shared_preferences: ^2.3.3
  google_fonts: ^6.2.1
  flutter_native_splash: ^2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "ordo-logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "ordo-logo.png"

flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#111111"
  image: "ordo-logo.png"
  image_dark: "ordo-logo.png"
  android: true
  ios: false
  android_gravity: center
  fullscreen: false

flutter:
  uses-material-design: true
  assets:
    - ordo-logo.png
